<!doctype html>

<!-- ASSIGN OUR ANGULAR MODULE -->
<html ng-app="scotchTodo">
<head>
	<!-- META -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1"><!-- Optimize mobile viewport -->

	<title>Node/Angular Todo App</title>

	<!-- SCROLLS -->
	<link rel="stylesheet" href="//netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap.min.css"><!-- load bootstrap -->
	<link rel="stylesheet" href="//netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.min.css">
	<style>
		html 					{ overflow-y:scroll; }
		body 					{ padding-top:50px; }
		#todo-list 				{ margin-bottom:30px; }
		#todo-form 	 			{ margin-bottom:50px; }
		.todo-completed			{ text-decoration: line-through; color: #999; }
		.todo-row				{ display:flex; align-items:center; justify-content:space-between; }
		.todo-row label			{ font-weight: normal; margin: 0; flex: 1; }
		.todo-row .todo-actions { margin-left: 10px; }
		.filter-bar				{ margin-bottom: 15px; }
	</style>

	<!-- SPELLS -->
	<script src="//ajax.googleapis.com/ajax/libs/angularjs/1.2.16/angular.min.js"></script><!-- load angular -->

	<script src="js/controllers/main.js"></script> <!-- load up our controller -->
	<script src="js/services/todos.js"></script> <!-- load our todo service -->
	<script src="js/core.js"></script> <!-- load our main application -->

</head>
<!-- SET THE CONTROLLER -->
<body ng-controller="mainController">
	<div class="container">

		<!-- HEADER AND TODO COUNT -->
		<div class="jumbotron text-center">
			<h1>I'm a Todo-aholic <span class="label label-info">{{ todos.length }}</span></h1>
		</div>

		<!-- TODO LIST -->
		<div id="todo-list" class="row">
			<div class="col-sm-6 col-sm-offset-3">

				<!-- FILTERS -->
				<div class="text-center filter-bar">
					<div class="btn-group">
						<button type="button"
								class="btn btn-default"
								ng-class="{ active: filterState === 'all' }"
								ng-click="setFilter('all')">
							All
						</button>
						<button type="button"
								class="btn btn-default"
								ng-class="{ active: filterState === 'active' }"
								ng-click="setFilter('active')">
							Active
						</button>
						<button type="button"
								class="btn btn-default"
								ng-class="{ active: filterState === 'completed' }"
								ng-click="setFilter('completed')">
							Completed
						</button>
					</div>
				</div>

				<!-- LOOP OVER THE TODOS IN $scope.todos -->
				<div class="checkbox" ng-repeat="todo in todos | filter:todoMatchesFilter track by todo._id">
					<div class="todo-row">
						<!-- Normal (non-editing) view -->
						<label ng-hide="editingTodoId === todo._id">
							<input type="checkbox"
								   ng-checked="todo.done"
								   ng-click="toggleDone(todo)">
							<span ng-class="{ 'todo-completed': todo.done }">{{ todo.text }}</span>
						</label>

						<!-- Editing view -->
						<div class="form-inline" ng-show="editingTodoId === todo._id" style="flex: 1;">
							<div class="form-group" style="width: 100%;">
								<input type="text"
									   class="form-control input-sm"
									   style="width: 100%;"
									   ng-model="editTextDraft"
									   ng-keydown="$event.keyCode === 13 && saveEditTodo(todo); $event.keyCode === 27 && cancelEditTodo();"
									   aria-label="Edit todo text">
							</div>
						</div>

						<div class="todo-actions">
							<!-- Edit button -->
							<button type="button"
									class="btn btn-xs btn-default"
									ng-hide="editingTodoId === todo._id"
									aria-label="Edit todo"
									title="Edit"
									ng-click="startEditTodo(todo)">
								<span class="fa fa-pencil"></span>
							</button>

							<!-- Save/Cancel buttons -->
							<button type="button"
									class="btn btn-xs btn-success"
									ng-show="editingTodoId === todo._id"
									aria-label="Save todo"
									title="Save"
									ng-click="saveEditTodo(todo)">
								<span class="fa fa-check"></span>
							</button>
							<button type="button"
									class="btn btn-xs btn-warning"
									ng-show="editingTodoId === todo._id"
									aria-label="Cancel edit"
									title="Cancel"
									ng-click="cancelEditTodo()">
								<span class="fa fa-times"></span>
							</button>

							<!-- Delete button -->
							<button type="button"
									class="btn btn-xs btn-danger"
									aria-label="Delete todo"
									title="Delete"
									ng-click="deleteTodo(todo._id)">
								<span class="fa fa-trash"></span>
							</button>
						</div>
					</div>
				</div>

				<p class="text-center" ng-show="loading">
					<span class="fa fa-spinner fa-spin fa-3x"></span>
				</p>

			</div>
		</div>

		<!-- FORM TO CREATE TODOS -->
		<div id="todo-form" class="row">
			<div class="col-sm-8 col-sm-offset-2 text-center">
				<form>
					<div class="form-group">

						<!-- BIND THIS VALUE TO formData.text IN ANGULAR -->
						<input type="text" class="form-control input-lg text-center" placeholder="I want to buy a puppy that will love me forever" ng-model="formData.text">
					</div>

					<!-- createToDo() WILL CREATE NEW TODOS -->
					<button type="submit" class="btn btn-primary btn-lg" ng-click="createTodo()">Add</button>
				</form>
			</div>
		</div>

		<div class="text-center text-muted">
			<p>A demo by <a href="http://scotch.io">Scotch</a>.</p>
			<p>Read the <a href="http://scotch.io/tutorials/javascript/creating-a-single-page-todo-app-with-node-and-angular">tutorial</a>.</p>
		</div>

	</div>

</body>
</html>
